function ShapeCard({ shape, idx, selected, onSelect, onChange, onRemove, showErr, nameOptions, otherNames, onArmDraw, arming }) {
  const [confirm, setConfirm] = useState(null);
  const [caliperOpen, setCaliperOpen] = useState(false);
  const [editingName, setEditingName] = useState(false);
  const set = (patch) => onChange({ ...shape, ...patch });
  const hasWork = shape.drawn || shape.generated;
  const guard = (applyFn) => { if (hasWork) setConfirm(() => applyFn); else applyFn(); };

  if (!shape.type) {
    return (
      <div className={'shapecard' + (selected ? ' sel' : '')}>
        <div className="sc-hdr" onClick={onSelect}>
          <div className="t"><span className="chip num">{idx + 1}</span>Select a shape</div>
          <div className="tools"><span className="del" title="Delete shape" onClick={(e) => { e.stopPropagation(); onRemove(); }}><TrashIcon /></span></div>
        </div>
        {selected && (
          <div className="sc-body">
            <div className="field">
              <span className="lbl">Shape</span>
              <select className="sel" value="" onChange={(e) => { const t = e.target.value; onChange({ ...makeShape(t), id: shape.id, name: nameOptions(t)[0] || '' }); }}>
                <option value="">Select shape…</option>
                {SHAPE_ORDER.map((k) => <option key={k} value={k}>{SHAPES[k].label}</option>)}
              </select>
              <div className="hint">Pick a shape to configure its name, mode, calipers, coordinates and boundary parameters.</div>
              {showErr && <div className="err">⚠ Select a shape to configure.</div>}
            </div>
          </div>
        )}
      </div>
    );
  }

  const spec = SHAPES[shape.type];
  const coordDefs = spec.coordsByCaliper ? spec.coordsByCaliper[shape.caliperType] : spec.coords;
  const perUnit = spec.perUnit;
  const curUnit = perUnit ? shape.units[shape.selUnit] : null;
  const segNoMask = shape.mode === 'segmentation' && !shape.classMask;
  const overlapErr = shape.mode === 'segmentation' && shape.drawn && shape.offMask;
  const isBoxCaliper = spec.drawKind === 'box' || spec.drawKind === 'quad';
  const axisErr = axisError(spec, perUnit ? curUnit.boundary : shape.boundary);
  const nameSuffix = shape.name && shape.name.startsWith(spec.prefix + '_') ? shape.name.slice(spec.prefix.length + 1) : (shape.name || '');
  const dupName = !!shape.name && (otherNames || []).includes(shape.name);
  const drawEnclosure = spec.drawKind === 'circle' ? 'Circle' : shape.type === 'line' ? 'Line ROI' : 'Box';

  const changeType = (t) => guard(() => onChange({ ...makeShape(t), id: shape.id, mode: shape.mode, classMask: shape.classMask, name: nameOptions(t)[0] || '' }));
  const changeMode = (m) => guard(() => set({ mode: m, drawn: false, generated: false, offMask: false, coords: {} }));
  const changeCaliperType = (ct) => guard(() => set({ caliperType: ct, drawn: false, generated: false, coords: {} }));

  const unitPatch = (field, patch) => {
    const units = shape.units.map((u, i) => i === shape.selUnit ? { ...u, [field]: { ...u[field], ...patch } } : u);
    set({ units });
  };
  const setCoord = (k, v) => {
    if (perUnit && perUnit.perCoords) {
      const units = shape.units.map((u, i) => i === shape.selUnit ? { ...u, coords: { ...u.coords, [k]: Number(v) } } : u);
      set({ units, generated: false });
    } else set({ coords: { ...shape.coords, [k]: Number(v) }, generated: false });
  };
  const shownCoords = perUnit && perUnit.perCoords ? curUnit.coords : shape.coords;

  return (
    <div className={'shapecard' + (selected ? ' sel' : '')}>
      <ConfirmModal open={!!confirm} onKeep={() => setConfirm(null)} onDiscard={() => { confirm(); setConfirm(null); }} />
      <div className="sc-hdr" onClick={onSelect}>
        <div className="t">
          <span className="chip num">{idx + 1}</span>
          {editingName ? (
            <span className={'namewrap sm' + (dupName ? ' dup' : '')} onClick={(e) => e.stopPropagation()}>
              <span className="nameprefix">{spec.prefix}_</span>
              <input className="nameinput" autoFocus type="text" value={nameSuffix} placeholder="1"
                onChange={(e) => set({ name: spec.prefix + '_' + e.target.value.replace(/\s+/g, '') })}
                onBlur={() => setEditingName(false)}
                onKeyDown={(e) => { if (e.key === 'Enter') setEditingName(false); }} />
            </span>
          ) : (
            <span>{shape.name || spec.label}</span>
          )}
          {selected && !editingName && (
            <span className="pencil" title="Rename" onClick={(e) => { e.stopPropagation(); setEditingName(true); }}><PencilIcon /></span>
          )}
        </div>
        <div className="tools"><span className="del" title="Delete shape" onClick={(e) => { e.stopPropagation(); onRemove(); }}><TrashIcon /></span></div>
      </div>
      {selected && (
        <div className="sc-body">
          {dupName && <div className="err" style={{ marginBottom: 10 }}>⚠ A shape named “{shape.name}” already exists in this capture. Rename it (pencil icon above).</div>}

          {/* Shape type */}
          <div className="field">
            <span className="lbl">Shape</span>
            <select className="sel" value={shape.type} onChange={(e) => changeType(e.target.value)}>
              <option value="">Select shape…</option>
              {SHAPE_ORDER.map((k) => <option key={k} value={k}>{SHAPES[k].label}</option>)}
            </select>
          </div>

          {/* Mode */}
          <div className="field">
            <span className="lbl">Mode <span className="sub">· ROI the calipers search within</span></span>
            <div className="modetoggle">
              <button className={shape.mode === 'direct' ? 'on' : ''} onClick={() => changeMode('direct')}>Direct (Image / SA)</button>
              <button className={shape.mode === 'segmentation' ? 'on' : ''} onClick={() => changeMode('segmentation')}>Segmentation Class</button>
            </div>
          </div>

          {shape.mode === 'segmentation' && (
            <div className="field">
              <span className="lbl">Segmentation Class Mask</span>
              <select className="sel" value={shape.classMask} onChange={(e) => set({ classMask: e.target.value })}>
                <option value="">Select class mask…</option>
                {CLASS_MASKS.map((m) => <option key={m.id} value={m.id}>{m.label}</option>)}
              </select>
              {showErr && segNoMask && <div className="err">⚠ Select a class mask for segmentation mode.</div>}
            </div>
          )}

          {/* Caliper Type (circle only) */}
          {spec.hasCaliperType && (
            <div className="field">
              <span className="tinylab">Caliper Type</span>
              <select className="sel" value={shape.caliperType} onChange={(e) => changeCaliperType(e.target.value)}>
                {spec.caliperTypes.map((t) => <option key={t}>{t}</option>)}
              </select>
            </div>
          )}

          {/* Draw + Generate (Generate sits next to Redraw once drawn) */}
          <div className="field">
            {arming ? (
              <button className="drawbtn armed" onClick={onArmDraw}>◉ Sketching on canvas…</button>
            ) : shape.drawn ? (
              <div className="row2btn">
                <button className="drawbtn done" onClick={onArmDraw}>↻ Redraw</button>
                <button className={'genbtn' + (shape.generated ? ' re' : '') + (overlapErr || axisErr ? ' dis' : '')}
                  disabled={!!(overlapErr || axisErr)}
                  onClick={() => { if (!overlapErr && !axisErr) set({ generated: true }); }}>
                  {shape.generated ? '↻ Regenerate' : '✦ Generate Shape'}
                </button>
              </div>
            ) : (
              <button className="drawbtn" onClick={onArmDraw}>
                ✎ Draw {drawEnclosure}{spec.drawKind === 'quad' ? ' (Quadra Box)' : ''} on canvas
              </button>
            )}
            {arming && <div className="hint">{spec.drawKind === 'circle' ? 'Drag from centre outward to set the radius.' : 'Drag to draw the rectangular ROI.'}</div>}
            {shape.drawn && shape.mode === 'segmentation' && !shape.offMask && <div className="okline">✓ Calipers overlap the segmentation mask</div>}
            {overlapErr && <div className="err">⚠ Drawn ROI has no overlap with the segmentation mask. Reposition / redraw the shape.</div>}
            {shape.drawn && axisErr && <div className="err">⚠ Fix the ellipse axis values below before generating.</div>}
            {shape.generated && <div className="okline">✓ Shape trace generated on canvas</div>}
            {showErr && !shape.drawn && <div className="err">⚠ Draw the {drawEnclosure.toLowerCase()} before proceeding.</div>}
          </div>

          {/* Coordinates */}
          {shape.drawn && (
            <div className="field">
              <div className="block-t">{spec.coordTitle}{perUnit && perUnit.perCoords ? ` · ${perUnit.label} ${shape.selUnit + 1}` : ''} <span className="ln" /></div>
              {perUnit && perUnit.perCoords && (
                <div className="boxtabs">
                  {shape.units.map((_, i) => <button key={i} className={shape.selUnit === i ? 'on' : ''} onClick={() => set({ selUnit: i })}>{perUnit.label} {i + 1}</button>)}
                </div>
              )}
              <div className="row3">
                {(perUnit && perUnit.perCoords ? spec.coords : coordDefs).map(([k, lab]) => (
                  <div key={k}>
                    <span className="tinylab">{lab}</span>
                    <input className="inp" type="number" value={shownCoords[k] ?? 0} onChange={(e) => setCoord(k, e.target.value)} />
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Caliper Parameters — collapsed under a "Configure Calipers" link */}
          {shape.drawn && (
            <div className="field">
              <button className="configlink" onClick={() => setCaliperOpen((v) => !v)}>
                <span className="chev">{caliperOpen ? '▾' : '▸'}</span> Configure Calipers{perUnit && perUnit.perCaliper ? ` · ${perUnit.label} ${shape.selUnit + 1}` : ''}
              </button>
              {caliperOpen && (
                <div className="config-body">
                  <div className="calrow">
                    {spec.caliperParams.map((k) => {
                      const meta = CALIPER_PARAM_META[k];
                      const usePer = perUnit && perUnit.perCaliper;
                      const val = usePer ? curUnit.caliper[k] : shape.caliper[k];
                      const onV = (v) => usePer ? unitPatch('caliper', { [k]: v }) : set({ caliper: { ...shape.caliper, [k]: v } });
                      return <NumberField key={k} label={meta.label} unit={meta.unit} value={val} min={meta.min} max={meta.max} onChange={onV} />;
                    })}
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Boundary Parameters */}
          {shape.drawn && (
            <div className="field">
              <div className="block-t">Boundary Parameters{perUnit ? ` · ${perUnit.label} ${shape.selUnit + 1}` : ''} <span className="ln" /></div>
              {perUnit && !perUnit.perCoords && (
                <div className="boxtabs">
                  {shape.units.map((_, i) => <button key={i} className={shape.selUnit === i ? 'on' : ''} onClick={() => set({ selUnit: i })}>{perUnit.label} {i + 1}</button>)}
                </div>
              )}
              <BoundaryEditor spec={spec}
                boundary={perUnit ? curUnit.boundary : shape.boundary}
                patch={(p) => perUnit ? unitPatch('boundary', p) : set({ boundary: { ...shape.boundary, ...p } })} />
            </div>
          )}

          {/* General params (e.g. Max Angle Difference) — outside per-unit editors */}
          {shape.drawn && spec.general.length > 0 && (
            <div className="field">
              <div className="block-t">General <span className="ln" /></div>
              {spec.general.map(([k, lab, sub]) => (
                <NumberField key={k} label={lab} sub={sub} value={shape.general[k]} min={0} max={180}
                  onChange={(v) => set({ general: { ...shape.general, [k]: v } })} />
              ))}
            </div>
          )}

        </div>
      )}
    </div>
  );
}

/* ================= VISION ================= */
const STEPS = ['Module Inputs', 'Module Setup', 'Module Outputs'];

function VisionConfig({ toast }) {
  const [step, setStep] = useState(0);
  const [baseSA, setBaseSA] = useState('sa1');
  const [shapes, setShapes] = useState(() => [makeShape('')]);
  const [sel, setSel] = useState(() => shapes[0].id);
  const [showErr, setShowErr] = useState(false);
  const [arming, setArming] = useState(null);

  const activeShape = shapes.find((s) => s.id === sel) || shapes[0];
  const segMode = activeShape && activeShape.mode === 'segmentation';

  // name options for a given type: prefix + n, excluding names used by OTHER shapes
  const nameOptions = useCallback((type) => {
    const prefix = SHAPES[type]?.prefix || 'Shape';
    const used = new Set(shapes.filter((s) => s.id !== sel && s.type === type).map((s) => s.name));
    const out = [];
    for (let i = 1; out.length < 8; i++) { const nm = `${prefix}_${i}`; if (!used.has(nm)) out.push(nm); }
    return out;
  }, [shapes, sel]);

  const updateShape = (ns) => setShapes((prev) => prev.map((s) => s.id === ns.id ? ns : s));
  const addShape = () => { const ns = makeShape(''); setShapes((p) => [...p, ns]); setSel(ns.id); setShowErr(false); setArming(null); };
  const removeShape = (id) => setShapes((p) => {
    const nx = p.filter((s) => s.id !== id);
    if (id === sel && nx.length) setSel(nx[0].id);
    return nx.length ? nx : [makeShape('')];
  });

  const armDraw = () => {
    const spec = SHAPES[activeShape.type];
    if (spec.drawKind === 'quad') {
      // composite: place the 4-box template directly
      const cx = 250, cy = 190, w = 190, h = 120;
      const units = activeShape.units.map((u, i) => { const uc = quadDefaultUnitsCoords(cx, cy, w, h)[i]; return { ...u, coords: uc, caliper: deriveUnitCaliper({ ...u, coords: uc }) }; });
      const ns = { ...activeShape, drawn: true, generated: false, offMask: false, coords: { cx, cy, w, h, angle: 0 }, units };
      updateShape({ ...ns, offMask: SHAPES[ns.type] && ns.mode === 'segmentation' ? !computeOverlap(ns) : false });
      return;
    }
    setArming(activeShape.id);
  };
  const onDrawn = (geo) => {
    const coords = geoToCoords(activeShape, geo);
    let ns = { ...activeShape, drawn: true, generated: false, coords };
    if (SHAPES[ns.type].perUnit && SHAPES[ns.type].perUnit.perCoords) {
      ns.units = ns.units.map((u, i) => { const uc = quadDefaultUnitsCoords(coords.cx, coords.cy, coords.w, coords.h)[i]; return { ...u, coords: uc, caliper: deriveUnitCaliper({ ...u, coords: uc }) }; });
    }
    ns.caliper = deriveCaliper(ns);
    ns.offMask = ns.mode === 'segmentation' ? !computeOverlap(ns) : false;
    updateShape(ns); setArming(null);
  };
  const onRotate = (angle) => {
    const ns = { ...activeShape, coords: { ...activeShape.coords, angle }, generated: false };
    ns.offMask = ns.mode === 'segmentation' ? !computeOverlap(ns) : false;
    updateShape(ns);
  };
  // interactive move / resize on the canvas → re-derive packed calipers + full-box height
  const onCoords = (coords) => {
    let ns = { ...activeShape, coords: { ...activeShape.coords, ...coords }, generated: false };
    ns.caliper = deriveCaliper(ns);
    ns.offMask = ns.mode === 'segmentation' ? !computeOverlap(ns) : false;
    updateShape(ns);
  };

  const typedShapes = shapes.filter((s) => s.type);
  const namesList = typedShapes.map((s) => s.name);
  const namesUnique = new Set(namesList).size === namesList.length && namesList.every(Boolean);
  const setupValid = typedShapes.length > 0 && namesUnique && shapes.every((s) => {
    if (!s.type || !s.drawn || !s.generated) return false;
    if (s.mode === 'segmentation' && (!s.classMask || s.offMask)) return false;
    if (axisError(SHAPES[s.type], s.boundary)) return false;
    return true;
  });

  const onNext = () => {
    if (step === 0) { if (!baseSA) { setShowErr(true); return; } setShowErr(false); setStep(1); return; }
    if (step === 1) {
      if (!setupValid) { setShowErr(true); toast('Finish every shape: draw it, resolve errors, and Generate Shape.', true); return; }
      setShowErr(false); setStep(2); return;
    }
    toast('Shape Extractor configured');
  };
  const onBack = () => { if (step === 0) { toast('Exited module configuration'); return; } setArming(null); setStep(step - 1); };

  return (
    <Fragment>
      <div className="stage">
        <div className="canvas-col">
          <div className="canvas-tools">
            <div className="ct">◳ Fit</div><div className="ct">⤢ Zoom</div>
            <div className="ct" style={{ color: 'var(--orange)' }}>▧ {STEPS[step]}</div>
          </div>
          <Canvas activeShape={step >= 1 ? activeShape : null} segMode={step >= 1 && segMode}
            arming={step === 1 && arming === (activeShape && activeShape.id)} onDrawn={onDrawn} onRotate={onRotate} onCoords={onCoords} editable={step === 1} />
          {step === 1 && arming && <div className="drawhint arm">◉ {SHAPES[activeShape.type].drawKind === 'circle' ? 'Drag from centre to set radius' : SHAPES[activeShape.type].drawKind === 'line' ? 'Drag from start to end' : 'Drag to draw the box'}</div>}
          {step === 1 && !arming && activeShape && !activeShape.type && <div className="drawhint">◆ Select a shape in the panel to begin</div>}
          {step === 1 && !arming && activeShape && activeShape.type && !activeShape.drawn && <div className="drawhint">✎ Click <span className="k">Draw</span> in the panel, then sketch here</div>}
        </div>

        <div className="flow-col">
          <div className="fnode master"><div className="ft">Master Image</div><div className="fs">1 capture</div></div>
          <div className="fconn" />
          <div className="fnode done"><span className="badge">✓</span><div className="ft">Segmentation</div><div className="fs">SEG_1</div></div>
          <div className="fconn" />
          <div className="fnode done"><span className="badge">✓</span><div className="ft">Search Area</div><div className="fs">SA_1</div></div>
          <div className="fconn" />
          <div className="fnode sel"><div className="ft">Shape Extractor</div><div className="fs">SHE_1</div></div>
        </div>

        <div className="pane">
          <div className="pane-hdr"><div className="ic"><span className="sq" /><span>4. Shape Extractor</span></div><span className="x" title="Close">✕</span></div>
          <div className="stepper">
            {STEPS.map((s, i) => (<Fragment key={s}><span className={'st' + (i === step ? ' active' : '')}>{s}</span>{i < STEPS.length - 1 && <span className="sep">›</span>}</Fragment>))}
          </div>

          <div className="pane-body">
            {step === 0 && (
              <div className="sec">
                <span className="lbl">Base Search Area</span>
                <select className="sel" value={baseSA} onChange={(e) => setBaseSA(e.target.value)}>
                  {SEARCH_AREAS.map((s) => <option key={s.id} value={s.id}>{s.label}</option>)}
                </select>
                <div className="hint">The parent search area (or masking / orientator output) this module runs on. Selecting a segmentation class is optional and is chosen per-shape in Module Setup.</div>
              </div>
            )}

            {step === 1 && (
              <div>
                <div style={{ padding: '12px 14px 2px' }}><button className="addbtn" onClick={addShape}>＋ Add Shape</button></div>
                {shapes.map((s, i) => (
                  <ShapeCard key={s.id} shape={s} idx={i} selected={s.id === sel}
                    onSelect={() => { setSel(s.id); setArming(null); }} onChange={updateShape} onRemove={() => removeShape(s.id)}
                    showErr={showErr && s.id === sel} nameOptions={nameOptions}
                    otherNames={shapes.filter((o) => o.id !== s.id).map((o) => o.name).filter(Boolean)}
                    onArmDraw={armDraw} arming={arming === s.id} />
                ))}
              </div>
            )}

            {step === 2 && (
              <div>
                <div style={{ padding: '12px 14px 4px', fontSize: 12, color: 'var(--muted)' }}>
                  Every extracted shape and its measurements are passed downstream (selected by default, non-editable).
                </div>
                {typedShapes.map((s, i) => {
                  const spec = SHAPES[s.type];
                  return (
                    <div className="outcard" key={s.id}>
                      <div className="oh"><span className="chip num" style={{ width: 19, height: 19, borderRadius: '50%', background: 'var(--ink)', color: '#fff', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontSize: 11 }}>{i + 1}</span>{s.name || spec.label}</div>
                      <div className="ob">
                        {spec.outputs.map((o) => (
                          <label className="outrow" key={o}><input type="checkbox" checked disabled readOnly /><span className="on">{o}</span></label>
                        ))}
                        <label className="outrow errrow"><input type="checkbox" checked disabled readOnly /><span className="on">Error %</span></label>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>

          <div className="pane-foot">
            <button className="btn btn-ghost" onClick={onBack}>{step === 0 ? 'Exit' : 'Back'}</button>
            <button className="btn btn-primary" onClick={onNext} disabled={step === 0 && !baseSA}>{step === STEPS.length - 1 ? 'Finish' : 'Next'}</button>
          </div>
        </div>
      </div>

      <div className="appbar">
        <span className="pill">1 of 4 · Inspection Workflow</span>
        <div className="steps">{STEPS.map((s, i) => <span key={s} className={'s' + (i === step ? ' cur' : '')}>{s}</span>)}</div>
        <span style={{ marginLeft: 'auto', color: 'var(--muted)' }}>{shapes.filter((s) => s.generated).length} shape{shapes.filter((s) => s.generated).length === 1 ? '' : 's'} configured</span>
      </div>
    </Fragment>
  );
}

/* ================= EDGE · EDIT MODULE CONFIGURATIONS ================= */
const clone = (x) => JSON.parse(JSON.stringify(x));
const DIST_AXIS_OPTS = ['x', 'y', 'euclidean'];
const REF_POINT_OPTS = ['point-to-point', 'centre-to-centre', 'edge-to-edge', 'nearest'];
const LABEL_SIZE_OPTS = [{ n: 'Small', px: 11 }, { n: 'Medium', px: 14 }, { n: 'Large', px: 18 }, { n: 'X-Large', px: 22 }];
const ANGLE_MODE_OPTS = ['from x axis', 'from y axis', 'two features'];
const UNIT_OPTS = ['mm', 'mm²', '°', 'px'];

// Per-shape dimensioning features, split by kind. Multi-line shapes flatten to "Edge 2 · Middle".
// `closed` = eligible for whole-shape types (Area / Convexity / ContourContinuity).
// Pure scalars (Radius, Perimeter, Circularity…) are intentionally excluded — those are module-level keys, not dimensions.
const perLine = (label, n, parts) => { const o = []; for (let i = 1; i <= n; i++) parts.forEach((p) => o.push(`${label} ${i} · ${p}`)); return o; };
const SHAPE_FEATURES = {
  circle:   { points: ['Centre'], lines: [], closed: true },
  line:     { points: ['Start', 'End', 'Middle'], lines: ['Whole line'], closed: false },
  ellipse:  { points: ['Centre', 'Focus 1', 'Focus 2'], lines: ['Major axis', 'Minor axis'], closed: true },
  quad:     { points: ['Vertex 1', 'Vertex 2', 'Vertex 3', 'Vertex 4', 'Middle (diagonal intersection)'],
              lines: ['Edge 1', 'Edge 2', 'Edge 3', 'Edge 4', 'Diagonal 1', 'Diagonal 2'], closed: true },
  parallel: { points: perLine('Line', 2, ['Start', 'End', 'Middle']), lines: ['Line 1', 'Line 2'], closed: false },
  edge:     { points: perLine('Line', 3, ['Start', 'End', 'Middle']), lines: ['Line 1', 'Line 2', 'Line 3'], closed: false },
  peak:     { points: ['Peak coordinate'], lines: [], closed: false },
};
// Shape-level scalar keys (the measurable outputs a shape emits; used by the Length dimension's sub-dropdown).
// Length dimension — the length-type keys a shape exposes (no angle keys).
const SHAPE_KEYS = {
  circle:   ['Radius', 'Diameter', 'Perimeter'],
  line:     ['Length'],
  ellipse:  ['Major axis', 'Minor axis'],
  quad:     ['Edge 1', 'Edge 2', 'Edge 3', 'Edge 4', 'Diagonal 1', 'Diagonal 2'],
  parallel: ['Line 1', 'Line 2'],
  edge:     ['Line 1', 'Line 2', 'Line 3'],
  peak:     [],
};
// Inference line colour palette (dropdown, not a hex picker).
const LINE_COLOURS = [
  { name: 'Green', hex: '#56b733' }, { name: 'Red', hex: '#e0473a' }, { name: 'Blue', hex: '#2f6fed' },
  { name: 'Orange', hex: '#e8542b' }, { name: 'Yellow', hex: '#f5c518' }, { name: 'Purple', hex: '#7c3aed' },
  { name: 'Cyan', hex: '#17b3c4' }, { name: 'White', hex: '#ffffff' }, { name: 'Black', hex: '#111111' },
];
// Each shape/feature emits parameters of certain dimensionalities: 0d (a point), 1d (a line/length), 2d (an area).
// A dimension type consumes parameter(s) of ONE dimensionality, so a shape qualifies for a type only when it exposes that param.
const SHAPE_DIMS = {
  peak:     ['0d'],
  line:     ['0d', '1d'],
  parallel: ['0d', '1d'],
  edge:     ['0d', '1d'],
  circle:   ['0d', '1d', '2d'],
  ellipse:  ['0d', '1d', '2d'],
  quad:     ['0d', '1d', '2d'],
};
// Type config. param = dimensionality of the parameter(s) consumed (or 'closed' = whole closed shape); two = needs two features;
// keyPick = a 2nd dropdown lists the chosen shape's scalar keys (Length only). Feature dropdowns list SHAPES filtered by param.
// Angle → two 1d, Distance → two 0d, Area → one 2d, Length → one 1d, Convexity / ContourContinuity → closed shapes only.
const DIM_TYPE_CFG = {
  1: { name: 'Angle', param: '1d', two: true, gt: true, unit: '°', linePick: true },
  2: { name: 'Distance', param: '0d', two: true, gt: true, unit: 'mm', axis: true },
  3: { name: 'Area', param: '2d', two: false, gt: true, unit: 'mm²' },
  4: { name: 'Length', param: '1d', two: false, gt: true, unit: 'mm', keyPick: true },
  5: { name: 'Convexity', param: 'closed', two: false, gt: false, unit: '' },
  6: { name: 'ContourContinuity', param: 'closed', two: false, gt: false, unit: '' },
};
const DIM_TYPE_OPTS = Object.entries(DIM_TYPE_CFG).map(([v, c]) => ({ v: Number(v), n: c.name }));
const shapeQualifies = (shape, type) => {
  const cfg = DIM_TYPE_CFG[type];
  if (cfg.param === 'closed') return !!SHAPE_FEATURES[shape.type].closed;            // circle / ellipse / quad only
  if (cfg.linePick) return ((SHAPE_FEATURES[shape.type] || {}).lines || []).length > 0;  // Angle needs a line/direction feature (excludes Circle & Peak)
  return (SHAPE_DIMS[shape.type] || []).includes(cfg.param);               // shape exposes a param of this dimensionality
};
// Length is the only type with a sub-dropdown — the chosen shape's scalar keys. Every other type picks a shape only.
const featuresOf = (shape, type) => {
  if (!shape || !DIM_TYPE_CFG[type].keyPick) return [];
  return SHAPE_KEYS[shape.type] || [];
};

function defaultSelector(s, type) {
  const cfg = DIM_TYPE_CFG[type];
  if (!s) return '';
  if (cfg.keyPick) return featuresOf(s, type)[0] || '';
  if (cfg.linePick) return ((SHAPE_FEATURES[s.type] || {}).lines || [])[0] || '';

  const capA = (prefCapture && valid.some((s) => s.captureId === prefCapture))
    ? prefCapture : (valid[0] ? valid[0].captureId : '');
  const inA = valid.filter((s) => s.captureId === capA);
  const s0 = inA[0];

    const alt = sameDimCaptures(capA).find((c) => c.id !== capA && valid.some((s) => s.captureId === c.id));
    if (alt) { capB = alt.id; poolB = valid.filter((s) => s.captureId === capB); }

  const s1 = poolB[0] || s0;

    captureOneId: capA, shapeOneId: s0 ? s0.id : '', shapeOneSelector: defaultSelector(s0, type),
    captureTwoId: cfg.two ? capB : '', shapeTwoId: cfg.two && s1 ? s1.id : '',
    shapeTwoSelector: cfg.two ? defaultSelector(s1, type) : '',

/* One capture's pixels: sharp only inside the band that capture actually resolves,
   softened elsewhere, and tinted with the capture's colour so the source is never ambiguous. */
function CaptureRender({ cap, pfx }) {

  return (
    <g>

        <filter id={pfx + '-blur'} x="-15%" y="-15%" width="130%" height="130%"><feGaussianBlur stdDeviation="2.5" /></filter>

function shapeBBox(s) {
  const c = s.coords || {};
  if (s.type === 'circle') { const r = c.r || 60; return [(c.cx ?? 250) - r, (c.cy ?? 190) - r, 2 * r, 2 * r]; }
  const cor = boxCorners(c.cx ?? 250, c.cy ?? 190, c.w ?? 140, c.h ?? 90, c.angle || 0);
  const xs = cor.map((q) => q[0]), ys = cor.map((q) => q[1]);
  return [Math.min(...xs), Math.min(...ys), Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys)];
}
const padBox = ([x, y, w, h], p) => [x - p, y - p, w + 2 * p, h + 2 * p];

// representative on-image point for a shape's feature (for the dimension preview)
function featPoint(shape, selector) {
  const c = shape.coords || {}, t = shape.type;
  const cx = c.cx ?? 250, cy = c.cy ?? 190;
  if (t === 'circle') return selector === 'Edge point' ? [cx + (c.r || 60), cy] : [cx, cy];
  if (t === 'peak') return [cx, cy];
  const w = c.w ?? 140, h = c.h ?? 90, a = (c.angle || 0) * Math.PI / 180, cos = Math.cos(a), sin = Math.sin(a);
  const loc = (dx, dy) => [cx + dx * cos - dy * sin, cy + dx * sin + dy * cos];
  if (t === 'line') return selector === 'Start' ? loc(-w / 2, 0) : selector === 'End' ? loc(w / 2, 0) : [cx, cy];
  if (t === 'ellipse') return selector === 'Focus 1' ? loc(w / 4, 0) : selector === 'Focus 2' ? loc(-w / 4, 0) : [cx, cy];
  if (t === 'quad') {
    const cor = boxCorners(cx, cy, w, h, c.angle || 0);
    let m = /Vertex (\d)/.exec(selector); if (m) return cor[(+m[1] - 1) % 4];
    m = /Edge (\d)/.exec(selector); if (m) { const i = (+m[1] - 1) % 4, p = cor[i], q = cor[(i + 1) % 4]; return [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2]; }
    return [cx, cy];
  }
  if (t === 'parallel' || t === 'edge') {
    const m = /Line (\d) · (\w+)/.exec(selector), off = h / 3;
    if (m) { const yo = +m[1] === 1 ? -off : off, dx = m[2] === 'Start' ? -w / 2 : m[2] === 'End' ? w / 2 : 0; return loc(dx, yo); }
    return [cx, cy];
  }
  return [cx, cy];
}
function shapeOutline(s, key, colour) {
  if (!s) return null;
  const c = s.coords || {}, col = colour || '#8b93a1';
  if (s.type === 'circle') return <circle key={key} cx={c.cx} cy={c.cy} r={c.r} fill="none" stroke={col} strokeWidth="1.5" strokeDasharray="3 3" />;
  const cor = boxCorners(c.cx ?? 250, c.cy ?? 190, c.w ?? 140, c.h ?? 90, c.angle || 0);
  return <polygon key={key} points={cor.map((p) => p.join(',')).join(' ')} fill="none" stroke={col} strokeWidth="1.5" strokeDasharray="3 3" />;
}

// Canvas preview of the dimension being authored.
// Captures paired inside one term are pixel-aligned (identical image dimensions is enforced on the
// dropdown), so a feature from one sits at the SAME coordinates on the other. The default view
// SUPERPOSES every capture the dimension touches at equal opacity — the images are near-identical,
// so the overlay reads cleanly and any misalignment is immediately obvious. Tabs step through the
// individual captures: each shows its own pixels at full strength and emphasises the terms
// configured on it, with the rest kept faint for context.
function DimensionCanvas({ dim, shapes }) {
  const byId = (id) => shapes.find((s) => s.id === id);
  const terms = allTerms(dim);
  const caps = capturesUsed(dim);
  const multi = caps.length > 1;

  const [tab, setTab] = useState('all');            // 'all' = superposed, else a captureId
  useEffect(() => { if (tab !== 'all' && !caps.includes(tab)) setTab('all'); }, [caps.join('|')]);
  const active = tab === 'all' ? null : tab;

  // every shape a term touches, tagged with the capture that owns it
  const usedShapes = [];
  terms.forEach((t) => {
    const cfg = DIM_TYPE_CFG[t.type];
    const two = cfg.linePick ? (t.angleMode || 'two features') === 'two features' : cfg.two;
    [t.shapeOneId, two ? t.shapeTwoId : null].forEach((id) => {
      const sh = id && byId(id);
      if (sh && !usedShapes.some((u) => u.id === sh.id)) usedShapes.push(sh);
    });
  });

  // one drawable segment per term, tagged with the captures it belongs to
  const segs = terms.map((t, i) => {
    const cfg = DIM_TYPE_CFG[t.type];
    const two = cfg.linePick ? (t.angleMode || 'two features') === 'two features' : cfg.two;
    const sA = byId(t.shapeOneId), sB = two ? byId(t.shapeTwoId) : null;
    const on = [sA, sB].filter(Boolean).map((sh) => sh.captureId);
    return {
      key: t.id || 'base', op: i === 0 ? null : t.op, type: cfg.name, caps: on,
      // a term belongs to the active tab only when every one of its features lives there
      here: !active || (on.length > 0 && on.every((c) => c === active)),
      pA: sA ? featPoint(sA, t.shapeOneSelector) : null,
      pB: sB ? featPoint(sB, t.shapeTwoSelector) : null,
    };
  });
  const shown = segs.filter((g) => g.here);
  const mids = shown.map((g) => g.pA && g.pB ? [(g.pA[0] + g.pB[0]) / 2, (g.pA[1] + g.pB[1]) / 2] : g.pA).filter(Boolean);
  const centre = mids.length
    ? [mids.reduce((n, m) => n + m[0], 0) / mids.length, mids.reduce((n, m) => n + m[1], 0) / mids.length]
    : null;
  const col = dim.okColor || '#56b733';
  const label = dim.name || 'Dimension';
  const layers = active ? [capById(active)] : caps.map(capById);

  return (
    <div className="canvas-wrap">
      <div className="frame">
        <span className="flabel">MASTER IMAGE · {active ? capLabel(active) : caps.map(capLabel).join(' + ')}</span>
        {multi && (
          <div className="canvasmodes">
            <button className={tab === 'all' ? 'on' : ''} onClick={() => setTab('all')}>Superposed</button>
            {caps.map((cid) => (
              <button key={cid} className={tab === cid ? 'on' : ''} onClick={() => setTab(cid)}>
                <span className="cdot" style={{ background: capById(cid).tint }} />{capLabel(cid)}
              </button>
            ))}
          </div>
        )}
        <svg width="500" height="380" viewBox="0 0 500 380">
          {/* superposed: equal-weight average of every capture (1, 1/2, 1/3 … stacks to equal parts) */}
          {layers.map((c, i) => (
            <g key={c.id} opacity={i === 0 ? 1 : 1 / (i + 1)}>
              <CaptureRender cap={c} pfx={'lay' + c.id} />
            </g>
          ))}

          {/* extracted geometry — coloured by the capture that owns it; other captures kept faint */}
          {usedShapes.map((sh, i) => (
            <g key={'o' + i} opacity={!active || sh.captureId === active ? 1 : 0.28}>
              {shapeOutline(sh, 'o' + i, multi ? capById(sh.captureId).tint : '#8b93a1')}
            </g>
          ))}

          {segs.map((g) => (
            <g key={g.key} opacity={g.here ? 1 : 0.22}>
              {g.pA && g.pB && <line x1={g.pA[0]} y1={g.pA[1]} x2={g.pB[0]} y2={g.pB[1]} stroke={col} strokeWidth="2.4" />}
              {g.pA && <circle cx={g.pA[0]} cy={g.pA[1]} r="4" fill={col} stroke="#fff" strokeWidth="1" />}
              {g.pB && <circle cx={g.pB[0]} cy={g.pB[1]} r="4" fill={col} stroke="#fff" strokeWidth="1" />}
              {g.op && g.pA && (() => {
                const mx = g.pB ? (g.pA[0] + g.pB[0]) / 2 : g.pA[0] + 15;
                const my = g.pB ? (g.pA[1] + g.pB[1]) / 2 : g.pA[1] - 15;
                return (
                  <g>
                    <circle cx={mx} cy={my} r="9" fill="#fff" stroke={col} strokeWidth="1.8" />
                    <text x={mx} y={my + 0.5} fontSize="12" fontWeight="800" fill={col} textAnchor="middle" dominantBaseline="middle">{g.op}</text>
                  </g>
                );
              })()}
            </g>
          ))}

          {/* which capture each endpoint came from */}
          {multi && usedShapes.map((sh, i) => {
            const pt = featPoint(sh, '');
            const c = capById(sh.captureId);
            return (
              <g key={'tag' + i} opacity={!active || sh.captureId === active ? 1 : 0.28}>
                <rect x={pt[0] - 30} y={pt[1] + 9} width="60" height="14" rx="7" fill={c.tint} opacity=".95" />
                <text x={pt[0]} y={pt[1] + 16.5} fill="#10141a" fontSize="9" fontWeight="800" textAnchor="middle" dominantBaseline="middle">{c.name}</text>
              </g>
            );
          })}

          {centre && (() => {
            const fs = dim.labelSize || 14, w = label.length * fs * 0.62 + 12, h = fs + 6, ry = centre[1] - 26 - h;
            return (
              <g>
                <rect x={centre[0] - w / 2} y={ry} width={w} height={h} rx="4" fill={col} />
                <text x={centre[0]} y={ry + h / 2 + 1} fill="#fff" fontSize={fs} fontWeight="700" textAnchor="middle" dominantBaseline="middle">{label}</text>
              </g>
            );
          })()}
        </svg>

        {multi && (
          <div className="caplegend">
            {active
              ? (shown.length > 0
                  ? <span className="capnote">Showing <b>{capLabel(active)}</b> ·{' '}
                      {shown.length} of {segs.length} {segs.length === 1 ? 'measurement' : 'measurements'} configured on it</span>
                  : <span className="capnote">Showing <b>{capLabel(active)}</b> · every measurement here is taken
                      <b> across captures</b>, so none sits wholly in it — see <b>Superposed</b></span>)
              : <span className="capnote">All {caps.length} captures superposed at equal opacity — they should overlay almost exactly</span>}
          </div>
        )}
      </div>
    </div>
  );
}

/* ================= COMPOUND DIMENSIONS =================
   A dimension is a SUM OF TERMS. A plain dimension has one term (held on the draft itself);
   a compound adds further terms in `draft.terms`, each with a + or − operator.
   Only + and − are offered, so left-to-right evaluation is exact — no precedence rules needed.
   Families: a compound may only mix types that produce the same kind of quantity.
     linear = Distance + Length (L+L, D+D, L+D)      area = Area only
   Angle, Convexity and Contour Continuity are never compoundable. */
const DIM_FAMILY = { 2: 'linear', 4: 'linear', 3: 'area' };
const familyOf = (type) => DIM_FAMILY[type] || null;
const compoundEligible = (type) => !!familyOf(type);
const typesInFamily = (fam) => Object.keys(DIM_FAMILY).filter((t) => DIM_FAMILY[t] === fam).map(Number);
const FAMILY_UNIT = { linear: 'mm', area: 'mm²' };
const allTerms = (d) => [d, ...(d.terms || [])];
// every capture a dimension touches, across all of its terms
const capturesUsed = (d) => {
  const out = new Set();
  allTerms(d).forEach((t) => {
    const cfg = DIM_TYPE_CFG[t.type];
    const two = cfg.linePick ? (t.angleMode || 'two features') === 'two features' : cfg.two;
    if (t.captureOneId) out.add(t.captureOneId);
    if (two && t.captureTwoId) out.add(t.captureTwoId);
  });
  return [...out];
};
function makeTerm(type, shapes, prefCapture) {
  return {
    id: 'trm_' + Math.floor(rnd() * 1e6), op: '+', type,
    distanceAxis: 'euclidean', angleMode: 'two features',
    ...typeDefaults(type, shapes, prefCapture),
  };
}
// short human label for one term, used in the formula strip and the list table
function termLabel(t, shapes) {
  const nm = (id) => (shapes.find((x) => x.id === id) || {}).name || '—';
  const cfg = DIM_TYPE_CFG[t.type];
  const two = cfg.linePick ? (t.angleMode || 'two features') === 'two features' : cfg.two;
  const a = nm(t.shapeOneId) + (t.shapeOneSelector ? ' · ' + t.shapeOneSelector : '');
  return two ? `${a} → ${nm(t.shapeTwoId)}${t.shapeTwoSelector ? ' · ' + t.shapeTwoSelector : ''}` : a;
}

/* One Capture → Feature → Point cascade. Rendered for the base term and for every compound term. */
function FeatureCascade({ node, patch, shapes, typeOpts, onType }) {
  const cfg = DIM_TYPE_CFG[node.type];
  const angleMode = node.angleMode || 'two features';
  const twoFeatures = cfg.linePick ? angleMode === 'two features' : cfg.two;
  const oneShape = shapes.find((x) => x.id === node.shapeOneId);
  const twoShape = shapes.find((x) => x.id === node.shapeTwoId);
  const oneIsPeak = (oneShape || {}).type === 'peak';
  const twoIsPeak = (twoShape || {}).type === 'peak';
  const oneIsLine = (oneShape || {}).type === 'line';
  const subOptsFor = (id) => {
    const s = shapes.find((x) => x.id === id); if (!s) return [];
    if (cfg.keyPick) return SHAPE_KEYS[s.type] || [];
    if (cfg.linePick) return (SHAPE_FEATURES[s.type] || {}).lines || [];
    if (cfg.axis && s.type !== 'peak') return (SHAPE_FEATURES[s.type] || {}).points || [];
    return [];
  };
  const optsB = (() => {
    const base = subOptsFor(node.shapeTwoId);
    if (!cfg.axis || twoIsPeak) return base;
    const extra = ['nearest from previous point'];
    if (oneIsLine) extra.push('perpendicular from previous point');
    return [...base, ...extra];
  })();
  const showSubA = (() => { const o = subOptsFor(node.shapeOneId); return cfg.linePick ? o.length > 1 : o.length > 0; })();
  const showSubB = cfg.linePick ? (subOptsFor(node.shapeTwoId).length > 1) : (optsB.length > 0);
  const defSel = (id) => subOptsFor(id)[0] || '';

  const capA = node.captureOneId || (CAPTURES[0] || {}).id;
  const capB = node.captureTwoId || capA;
  const shapesIn = (capId) => shapes.filter((s) => s.captureId === capId && shapeQualifies(s, node.type));
  const capOptsA = CAPTURES.filter((c) => shapesIn(c.id).length > 0);
  // pairing rule is WITHIN a term: the two features of one measurement must share a coordinate frame
  const capOptsB = sameDimCaptures(capA).filter((c) => shapesIn(c.id).length > 0);
  const crossCapture = twoFeatures && capA !== capB;
  const crossPosition = crossCapture && capById(capA).pos !== capById(capB).pos;

  const seedFeature = (which, capId) => {
    const list = shapesIn(capId);
    const taken = which === 'two' ? node.shapeOneId : node.shapeTwoId;
    const s0 = (capId === (which === 'two' ? capA : capB) ? list.find((x) => x.id !== taken) : null) || list[0];
    return which === 'one'
      ? { captureOneId: capId, shapeOneId: s0 ? s0.id : '', shapeOneSelector: defaultSelector(s0, node.type) }
      : { captureTwoId: capId, shapeTwoId: s0 ? s0.id : '', shapeTwoSelector: defaultSelector(s0, node.type) };
  };
  const changeCaptureA = (capId) => {
    const next = seedFeature('one', capId);
    const bStillValid = sameDimCaptures(capId).some((c) => c.id === capB) && shapesIn(capB).length > 0;
    patch({ ...next, ...(twoFeatures && !bStillValid ? seedFeature('two', capId) : {}) });
  };
  const changeShape = (which, id) => {
    const sel = defSel(id);
    patch(which === 'one' ? { shapeOneId: id, shapeOneSelector: sel } : { shapeTwoId: id, shapeTwoSelector: sel });
  };
  const captureSelect = (val, opts, onCh) => (
    <div className="capline">
      <select className="sel" value={val} onChange={(e) => onCh(e.target.value)}>
        {opts.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
      </select>
      <span className="cdims">{capDims(val)} px · {capById(val).focus}</span>
    </div>
  );
  const shapeSelect = (val, capId, onCh) => (
    <select className="sel" value={val} onChange={onCh}>
      {shapesIn(capId).map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
    </select>
  );

  return (
    <div>
      <div className="row3 field">
        {typeOpts && <div><span className="tinylab">Type</span>
          <select className="sel" value={node.type} onChange={(e) => onType(Number(e.target.value))}>
            {typeOpts.map((o) => <option key={o.v} value={o.v}>{o.n}</option>)}
          </select>
        </div>}
        {cfg.axis && <div><span className="tinylab">Distance Axis</span>
          <select className="sel" value={node.distanceAxis} onChange={(e) => patch({ distanceAxis: e.target.value })}>{DIST_AXIS_OPTS.map((o) => <option key={o}>{o}</option>)}</select></div>}
        {cfg.linePick && <div><span className="tinylab">Angle from</span>
          <select className="sel" value={angleMode} onChange={(e) => patch({ angleMode: e.target.value })}>{ANGLE_MODE_OPTS.map((o) => <option key={o}>{o}</option>)}</select></div>}
      </div>
      <div className="field">
        <span className="tinylab">{twoFeatures ? 'Feature A' : 'Feature'} <span className="sub">· capture › feature › point</span></span>
        {captureSelect(capA, capOptsA, changeCaptureA)}
        <div className="feat">
          {shapeSelect(node.shapeOneId, capA, (e) => changeShape('one', e.target.value))}
          {showSubA && <select className="sel" value={node.shapeOneSelector} onChange={(e) => patch({ shapeOneSelector: e.target.value })}>{subOptsFor(node.shapeOneId).map((f) => <option key={f}>{f}</option>)}</select>}
        </div>
        {cfg.axis && oneIsPeak && <div className="hint">Peak is itself the point.</div>}
      </div>
      {twoFeatures && (
        <div className="field">
          <span className="tinylab">Feature B {crossCapture && <span className="xcap sm">⇄ CROSS-CAPTURE</span>}</span>
          {captureSelect(capB, capOptsB, (v) => patch(seedFeature('two', v)))}
          <div className="feat">
            {shapeSelect(node.shapeTwoId, capB, (e) => changeShape('two', e.target.value))}
            {showSubB && <select className="sel" value={node.shapeTwoSelector} onChange={(e) => patch({ shapeTwoSelector: e.target.value })}>{optsB.map((f) => <option key={f}>{f}</option>)}</select>}
          </div>
          <div className="hint">Only captures of {capDims(capA)} px — the same image dimensions as {capLabel(capA)} — can be paired, so both features of this measurement share one coordinate frame.</div>
          {cfg.axis && twoIsPeak && <div className="hint">Peak is itself the point.</div>}
          {crossPosition && (
            <div className="noteline">
              <span>⚠</span>
              <span><b>{capLabel(capA)}</b> and <b>{capLabel(capB)}</b> are on different capture positions. Matching image
              dimensions do not guarantee they view the same area — switch the canvas to <b>Blend</b> to confirm the two
              captures line up before saving.</span>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// Dimension config form — one base term, optional compound terms, then name and ground truth.
function DimensionForm({ draft, setDraft, shapes }) {
  const cfg = DIM_TYPE_CFG[draft.type];
  const patch = (p) => setDraft({ ...draft, ...p });
  const terms = draft.terms || [];
  const fam = familyOf(draft.type);
  const isCompound = terms.length > 0;
  const namePrefix = cfg.name + '_';
  const nameSuffix = draft.name.startsWith(namePrefix) ? draft.name.slice(namePrefix.length) : draft.name;

  // Changing the base type re-seeds it; if the new type cannot compound, every extra term is dropped.
  const changeType = (type) => {
    const keep = familyOf(type) === fam ? terms : [];
    patch({ type, name: DIM_TYPE_CFG[type].name + '_' + nameSuffix, terms: keep,
      unit: keep.length ? FAMILY_UNIT[familyOf(type)] : DIM_TYPE_CFG[type].unit,
      ...typeDefaults(type, shapes, draft.captureOneId) });
  };
  const patchTerm = (id, p) => patch({ terms: terms.map((t) => t.id === id ? { ...t, ...p } : t) });
  const addTerm = () => {
    const t = makeTerm(draft.type, shapes, draft.captureOneId);
    patch({ terms: [...terms, t], unit: FAMILY_UNIT[fam] });
  };
  const removeTerm = (id) => {
    const next = terms.filter((t) => t.id !== id);
    patch({ terms: next, unit: next.length ? FAMILY_UNIT[fam] : cfg.unit });
  };
  const changeTermType = (id, type) => patchTerm(id, { type, ...typeDefaults(type, shapes, draft.captureOneId) });
  const famTypeOpts = fam ? DIM_TYPE_OPTS.filter((o) => familyOf(o.v) === fam) : [];
  const caps = capturesUsed(draft);

  return (
    <div style={{ padding: '4px 2px' }}>
      {isCompound && (
        <div className="formula">
          <span className="fk">Σ</span>
          <span className="fx">
            <b>{cfg.name}</b> <span>({termLabel(draft, shapes)})</span>
            {terms.map((t) => (
              <Fragment key={t.id}>
                <span className="op">{t.op}</span>
                <b>{DIM_TYPE_CFG[t.type].name}</b> <span>({termLabel(t, shapes)})</span>
              </Fragment>
            ))}
          </span>
        </div>
      )}

      <FeatureCascade node={draft} patch={patch} shapes={shapes} typeOpts={DIM_TYPE_OPTS} onType={changeType} />

      {/* ---- compound terms ---- */}
      {terms.map((t, i) => (
        <div className="term" key={t.id}>
          <div className="term-hd">
            <select className="opsel" value={t.op} onChange={(e) => patchTerm(t.id, { op: e.target.value })}>
              <option value="+">＋ add</option><option value="−">− subtract</option>
            </select>
            <span className="tt">Term {i + 2}</span>
            <span className="del" title="Remove term" onClick={() => removeTerm(t.id)}><TrashIcon /></span>
          </div>
          <div className="term-bd">
            <FeatureCascade node={t} patch={(p) => patchTerm(t.id, p)} shapes={shapes}
              typeOpts={famTypeOpts} onType={(ty) => changeTermType(t.id, ty)} />
          </div>
        </div>
      ))}

      {compoundEligible(draft.type) ? (
        <button className="configlink" onClick={addTerm}>
          <span className="chev">＋</span> Compound dimension{isCompound ? ' · add another term' : ''}
        </button>
      ) : (
        <div className="hint" style={{ marginTop: 4 }}>
          {cfg.name} cannot be combined with another dimension — only Distance, Length and Area can.
        </div>
      )}
      {compoundEligible(draft.type) && (
        <div className="hint" style={{ marginTop: 6 }}>
          {fam === 'area'
            ? 'An Area may only be combined with another Area.'
            : 'Distance and Length may be combined in any order (L+L, D+D, L+D).'} Terms may come from
          different captures — the values are combined after conversion to {FAMILY_UNIT[fam]}.
        </div>
      )}

      {/* ---- name sits directly above ground truth ---- */}
      <div className="block-t" style={{ marginTop: 12 }}>Dimension Name <span className="ln" /></div>
      <div className="field">
        <span className="namewrap">
          <span className="nameprefix">{cfg.name}_</span>
          <input className="nameinput" type="text" value={nameSuffix} placeholder="1"
            onChange={(e) => patch({ name: cfg.name + '_' + e.target.value.replace(/\s+/g, '') })} />
        </span>
      </div>

      {cfg.gt && (
        <>
          <div className="block-t" style={{ marginTop: 8 }}>Ground Truth
            {isCompound && <span className="xcap sm" style={{ marginLeft: 8 }}>ON THE COMBINED VALUE</span>}
            <span className="ln" /></div>
          {isCompound && <div className="hint" style={{ marginBottom: 8 }}>
            Applied once, to the result of the formula above. The individual terms have no ground truth
            and produce no pass/fail of their own.</div>}
          <div className="gtgrid">
            <div><span className="tinylab">Operator</span>
              <select className="sel" value={draft.operator} onChange={(e) => patch({ operator: Number(e.target.value) })}><option value={1}>=</option><option value={2}>&gt;</option><option value={3}>&lt;</option></select></div>
            <div><span className="tinylab">Value</span><input className="inp" type="number" min="0" value={draft.targetValue} onChange={(e) => patch({ targetValue: Math.max(0, Number(e.target.value)) })} /></div>
            <div><span className="tinylab">Tolerance</span><input className="inp" type="number" min="0" value={draft.tolerance} onChange={(e) => patch({ tolerance: Math.max(0, Number(e.target.value)) })} /></div>
            <div><span className="tinylab">Unit</span>
              {isCompound
                ? <input className="inp" value={FAMILY_UNIT[fam]} disabled readOnly />
                : <select className="sel" value={draft.unit} onChange={(e) => patch({ unit: e.target.value })}>{UNIT_OPTS.map((u) => <option key={u}>{u}</option>)}</select>}
            </div>
          </div>
          {isCompound && <div className="hint">Unit is fixed by the family being combined.</div>}
          {draft.type !== 1 && (
            <div className="field" style={{ marginTop: 10 }}>
              <span className="tinylab">Ratio (pixel to mm){caps.length > 1 ? ' · per capture' : ''}</span>
              {caps.length > 1 ? (
                <div className="ratiogrid">
                  {caps.map((cid) => (
                    <div key={cid}>
                      <span className="tinylab">{capLabel(cid)}</span>
                      <input className="inp" type="number" min="0" step="0.001"
                        value={(draft.ratios || {})[cid] ?? draft.ratio}
                        onChange={(e) => patch({ ratios: { ...(draft.ratios || {}), [cid]: Math.max(0, Number(e.target.value)) } })} />
                    </div>
                  ))}
                </div>
              ) : (
                <input className="inp" type="number" min="0" step="0.001" value={draft.ratio} onChange={(e) => patch({ ratio: Math.max(0, Number(e.target.value)) })} />
              )}
              {caps.length > 1 && <div className="hint">Each capture converts its own pixels before the terms are combined.</div>}
            </div>
          )}
        </>
      )}

      <div className="block-t" style={{ marginTop: 8 }}>Inference Line Colour{cfg.gt ? 's' : ''} <span className="ln" /></div>
      <div className="row2 field">
        <div><span className="tinylab">{cfg.gt ? 'OK colour' : 'Colour'}</span>
          <div className="colorwrap"><span className="swatch" style={{ background: draft.okColor }} />
            <select className="sel bare" value={draft.okColor} onChange={(e) => patch({ okColor: e.target.value })}>
              {LINE_COLOURS.map((c) => <option key={c.hex} value={c.hex}>{c.name}</option>)}
            </select></div>
        </div>
        {cfg.gt && <div><span className="tinylab">NG colour</span>
          <div className="colorwrap"><span className="swatch" style={{ background: draft.ngColor }} />
            <select className="sel bare" value={draft.ngColor} onChange={(e) => patch({ ngColor: e.target.value })}>
              {LINE_COLOURS.map((c) => <option key={c.hex} value={c.hex}>{c.name}</option>)}
            </select></div>
        </div>}
      </div>
      <div className="field">
        <span className="tinylab">Label Text Size</span>
        <select className="sel" value={draft.labelSize} onChange={(e) => patch({ labelSize: Number(e.target.value) })}>
          {LABEL_SIZE_OPTS.map((o) => <option key={o.px} value={o.px}>{o.n}</option>)}
        </select>
      </div>
      <div className="hint">{isCompound
        ? `At inference every term is drawn, each marked with its operator, and the combined value is labelled “${draft.name}” once — in the OK colour when in-spec and the NG colour when out of tolerance.`
        : cfg.gt
          ? `At inference, this dimension is drawn as a single line labelled “${draft.name}” (label text size set above), in the OK colour when in-spec and the NG colour when out of tolerance.`
          : `At inference, this dimension is drawn as a single line labelled “${draft.name}” (label text size set above), in the colour set above (${cfg.name} has no ground truth, so there is no OK/NG state).`}</div>
    </div>
  );
}

// Dimension Configuration: table list ↔ add/edit sub-page
function DimensionConfig({ dims, setDims, shapes }) {
  const [view, setView] = useState('list');
  const [draft, setDraft] = useState(null);
  const [editId, setEditId] = useState(null);
  const shapeName = (id) => (shapes.find((s) => s.id === id) || {}).name || '';
  // A dimension errors when a shape it points at no longer exists — this blocks deployment
  // until the operator re-points it or deletes it.
  const dimError = (d) => {
    for (const [i, t] of allTerms(d).entries()) {
      const c = DIM_TYPE_CFG[t.type];
      const two = c.linePick ? (t.angleMode || 'two features') === 'two features' : c.two;
      const where = i === 0 ? '' : ` (term ${i + 1})`;
      if (!shapes.some((x) => x.id === t.shapeOneId)) return `Feature A shape no longer exists${where}`;
      if (two && !shapes.some((x) => x.id === t.shapeTwoId)) return `Feature B shape no longer exists${where}`;
    }
    return null;
  };
  const errored = dims.filter(dimError);
  const startAdd = () => { setDraft(makeDim(shapes, dims.length + 1)); setEditId(null); setView('edit'); };
  const startEdit = (d) => { setDraft(clone(d)); setEditId(d.id); setView('edit'); };
  const saveDraft = () => {
    setDims((p) => editId ? p.map((d) => d.id === editId ? draft : d) : [...p, draft]);
    setView('list'); setDraft(null); setEditId(null);
  };
  const remove = (id) => setDims((p) => p.filter((d) => d.id !== id));

  if (view === 'edit' && draft) {
    return (
      <div className="dimedit">
        <div className="dimedit-hd">
          <button className="linkback" onClick={() => setView('list')}>← Dimension Configuration</button>
          <span>{editId ? 'Edit' : 'Add'} Dimension</span>
        </div>
        <div className="dimedit-split">
          <div className="dimedit-form"><DimensionForm draft={draft} setDraft={setDraft} shapes={shapes} /></div>
          <div className="emc-canvas">
            <div className="canvas-tools"><div className="ct">◳ Fit</div><div className="ct" style={{ color: 'var(--orange)' }}>▧ {draft.name}</div></div>
            <DimensionCanvas dim={draft} shapes={shapes} />
          </div>
        </div>
        <div className="emc-foot">
          <button className="btn btn-ghost sm" onClick={() => setView('list')}>Cancel</button>
          <button className="btn btn-primary sm" onClick={saveDraft}>Save Dimension</button>
        </div>
      </div>
    );
  }
  return (
    <div className="dimlist">
      {dims.length === 0
        ? <div className="banner warn">⚠ No dimensions configured for this variant. A variant whose Shape Extractor has no dimensions <b>cannot be deployed</b> — add at least one before deploying.</div>
        : errored.length > 0
          ? <div className="banner warn">⚠ {errored.length} dimension{errored.length > 1 ? 's' : ''} point at a shape that no longer exists. <b>Deployment is blocked</b> until each one is re-pointed at another shape or deleted.</div>
          : <div className="banner ok">✓ {dims.length} dimension{dims.length > 1 ? 's' : ''} configured for this variant · {dims.filter(isCrossCapture).length} across captures.</div>}
      <div style={{ fontSize: 12, color: 'var(--muted)', margin: '-6px 0 14px', lineHeight: 1.5 }}>
        Dimensions are configured for the whole <b>variant</b>. A dimension may take its two features from
        different captures, provided those captures have identical image dimensions.
      </div>
      <div className="dimlist-hd">
        <div className="t">Dimensions</div>
        <button className="btn btn-primary sm" onClick={startAdd}>＋ Add Dimension</button>
      </div>
      {dims.length > 0 && (
        <table className="dimtable">
          <thead><tr><th>#</th><th>Name</th><th>Type</th><th>Capture</th><th>Definition</th><th>Ground Truth</th><th></th></tr></thead>
          <tbody>
            {dims.map((d, i) => {
              const cfg = DIM_TYPE_CFG[d.type], op = { 1: '=', 2: '>', 3: '<' }[d.operator];
              const two = d.type === 1 ? (d.angleMode || 'two features') === 'two features' : cfg.two;
              const x = isCrossCapture(d), err = dimError(d);
              const dTerms = allTerms(d), compound = dTerms.length > 1;
              const dCaps = capturesUsed(d);
              return (
                <tr key={d.id} style={err ? { background: '#fdf3f1' } : null}>
                  <td>{i + 1}</td>
                  <td><span className="dot" style={{ background: d.okColor }} />{d.name}
                    {err && <div style={{ color: 'var(--red)', fontSize: 10.5, fontWeight: 700, marginTop: 2 }}>⚠ {err}</div>}</td>
                  <td>{compound
                    ? <span><span className="xcap sm">COMPOUND</span> <span style={{ marginLeft: 5 }}>{dTerms.map((t) => DIM_TYPE_CFG[t.type].name).join(' · ')}</span></span>
                    : cfg.name}</td>
                  <td>{x
                    ? <span className="xcap sm">{dCaps.map(capLabel).join(' ⇄ ')}</span>
                    : capLabel(d.captureOneId)}</td>
                  <td style={{ maxWidth: 320 }}>
                    {dTerms.map((t, ti) => (
                      <div key={t.id || 'base'} style={{ whiteSpace: 'nowrap' }}>
                        {ti > 0 && <b style={{ color: 'var(--orange)', marginRight: 5 }}>{t.op}</b>}
                        {termLabel(t, shapes)}
                      </div>
                    ))}
                  </td>
                  <td>{cfg.gt ? `${op} ${d.targetValue} ± ${d.tolerance} ${d.unit}` : '—'}</td>
                  <td className="acts">
                    <span title="Edit" onClick={() => startEdit(d)}>✎</span>
                    <span title="Delete" onClick={() => remove(d.id)}><TrashIcon /></span>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      )}
    </div>
  );
}

function EdgeShell({ toast }) {
  const [tab, setTab] = useState('emc');           // 'emc' | 'dim'
  const [shapes, setShapes] = useState(seedEdgeShapes);
  const [dims, setDims] = useState(seedDims);
  const [emcCap, setEmcCap] = useState(CAPTURES[0].id);   // Edit Module Configurations is per capture
  const [sel, setSel] = useState(() => shapes.find((s) => s.captureId === CAPTURES[0].id).id);
  const [dirty, setDirty] = useState(false);
  const [reviewModal, setReviewModal] = useState(false);
  const initial = useRef(null);
  useEffect(() => { if (!initial.current) initial.current = clone(shapes); }, []);
  // EMC only ever edits the shapes belonging to the selected capture
  const capShapes = shapes.filter((s) => s.captureId === emcCap);
  useEffect(() => { if (capShapes.length && !capShapes.some((s) => s.id === sel)) setSel(capShapes[0].id); }, [emcCap, shapes]);

  const onSave = () => { initial.current = clone(shapes); setDirty(false); toast('Shape Extractor changes saved'); setReviewModal(true); };
  const onReset = () => { if (initial.current) { setShapes(clone(initial.current)); setDirty(false); } };

  return (
    <div className="emc">
      <div className="emc-crumbs">Instances <span>›</span> Inferencing Customization <span>›</span> <b>{tab === 'emc' ? 'Edit Module Configurations' : 'Dimension Configuration'}</b></div>
      <div className="emc-selectors">
        <div className="fld grow">
          <label>Instance <span style={{ fontWeight: 400, color: 'var(--muted)' }}>(Instance · Project · Plant)</span></label>
          <select className="sel"><option>Line-A Cell 3 · GasketInspect · Plant Pune</option></select>
        </div>
        {tab === 'emc' ? (
          <Fragment>
            <div className="fld"><label>Variant | Capture</label>
              <select className="sel" value={emcCap} onChange={(e) => setEmcCap(e.target.value)}>
                {CAPTURES.map((c) => <option key={c.id} value={c.id}>Variant A | {c.name}</option>)}
              </select>
            </div>
            <div className="fld"><label>Module</label><select className="sel"><option>SHE_1 · Shape Extractor</option></select></div>
          </Fragment>
        ) : (
          /* Dimensioning is variant-scoped — it may span captures, so it cannot hang off one */
          <div className="fld"><label>Variant</label><select className="sel"><option>Variant A</option></select></div>
        )}
      </div>
      <div className="emc-tabs">
        <button className={tab === 'emc' ? 'on' : ''} onClick={() => setTab('emc')}>Edit Module Configurations</button>
        <button className={tab === 'dim' ? 'on' : ''} onClick={() => setTab('dim')}>Dimension Configuration</button>
      </div>

      <div className="emc-body">
        {tab === 'emc'
          ? <EdgeShapeEditor shapes={capShapes} setShapes={setShapes} sel={sel} setSel={setSel} onDirty={() => setDirty(true)} />
          : <DimensionConfig dims={dims} setDims={setDims} shapes={shapes} />}
      </div>

      {tab === 'emc' && (
        <div className="emc-foot">
          <button className="btn btn-ghost sm" disabled={!dirty} onClick={onReset}>Reset</button>
          <button className="btn btn-primary sm" disabled={!dirty} onClick={onSave}>Save</button>
        </div>
      )}

      {reviewModal && (
        <div className="overlay" onClick={() => setReviewModal(false)}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <div className="mh">⚠ Review dimensions before deploying</div>
            <div className="mb">You changed a Shape Extractor module. The dimensions computed from its shapes may have changed as a result. Please review <b>Dimension Configuration</b> before making any deployments.</div>
            <div className="mf">
              <button className="btn btn-ghost" onClick={() => setReviewModal(false)}>Dismiss</button>
              <button className="btn btn-primary" onClick={() => { setTab('dim'); setReviewModal(false); }}>Go to Dimension Configuration</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ================= APP ================= */
function App() {
  const [view, setView] = useState('vision');
  const [toast, setToast] = useState(null);
  const showToast = (msg, warn) => { setToast({ msg, warn }); setTimeout(() => setToast(null), 2400); };
  return (
    <div className="app">
      <div className="topbar">
        <div className="brand">
          <span className="dot">F</span><span>Shape Extractor</span>
          <span className="crumbs">&nbsp;·&nbsp; Recipe Management ▸ Variant A ▸ Capture 1 ▸ <b>Module Configuration</b></span>
        </div>
        <div className="switch">
          <button className={view === 'vision' ? 'on' : ''} onClick={() => setView('vision')}><span className="pv">VISION</span> Module Configuration</button>
          <button className={view === 'edge' ? 'on' : ''} onClick={() => setView('edge')}><span className="pv edge">EDGE</span> Inferencing Customization</button>
        </div>
      </div>
      {view === 'vision' ? <VisionConfig toast={showToast} /> : <EdgeShell toast={showToast} />}
      {toast && <div className={'toast' + (toast.warn ? ' warn' : '')}>{toast.warn ? '⚠' : '✓'} {toast.msg}</div>}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
